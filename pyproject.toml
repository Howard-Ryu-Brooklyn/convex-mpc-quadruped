# ─────────────────────────────────────────────────────────────────────
# 패키지 메타데이터
# ─────────────────────────────────────────────────────────────────────
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quadruped-mpc"
version = "0.1.0"
description = "Convex MPC quadruped locomotion: an ideal single-rigid-body plant and a MuJoCo plant behind one interface"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Howard Ryu" }]
keywords = ["quadruped", "convex-mpc", "model-predictive-control", "mujoco", "legged-robotics"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

# 상한을 두는 이유: osqp 1.x 는 이미 warm_start -> warm_starting 개명을
# 예고했고, numpy 2.x 는 ndarray.ptp 를 없앴다. 의존성이 조용히 올라가면
# 골든 궤적이 바뀌고, 그 원인을 찾는 데 하루가 든다.
dependencies = [
    "numpy>=2.1,<3",
    "scipy>=1.14,<2",
    "osqp>=1.0,<2",
    "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
mujoco = ["mujoco>=3.2,<4"]
notebook = ["ipython>=8", "ipykernel>=6", "mediapy>=1.2"]
dev = [
    "pytest>=8",
    "mypy>=1.11",
    "nbstripout>=0.7",
]

[project.urls]
Repository = "https://github.com/Howard-Ryu-Brooklyn/Convex-MPC"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

markers = [
    "golden: 기준선 궤적 비교. 의도한 변경 뒤에는 `make accept`로 갱신한다",
    "slow: 실행이 오래 걸리는 테스트 (S2 endurance, gait 매트릭스 등)",
]

# 무관한 경고를 끄는 목적은 '조용히 하기'가 아니라 진짜 신호를 보이게 하는 것이다.
# 580개에 묻혀 있던 osqp deprecation(warm_start -> warm_starting,
# osqp.constant 직접 접근)은 의도적으로 남긴다. 의존성 핀 고정이 없어 생긴
# 실제 위험 신호이며 Step 8에서 처리한다.
filterwarnings = [
    "ignore::DeprecationWarning:matplotlib.*",
    "ignore::PendingDeprecationWarning:matplotlib.*",
    "ignore:.*oneOf.*:DeprecationWarning",
    "ignore:.*parseString.*:DeprecationWarning",
    "ignore:.*resetCache.*:DeprecationWarning",
    "ignore:.*enablePackrat.*:DeprecationWarning",
]


# ─────────────────────────────────────────────────────────────────────
# mypy — 타입 힌팅을 '주석'에서 '검사'로 바꾸는 지점
# ─────────────────────────────────────────────────────────────────────
# 검사기를 돌리지 않는 타입은 독스트링과 다를 바 없다. 이 프로젝트는
# 독스트링이 규약을 강제하지 못한다는 것을 두 번 확인했다 —
# 결함 5(절대/상대 위치)와 결함 11("왼쪽 다리: 양수"라고 적혀 있었으나
# 호출부는 네 다리에 같은 값을 넘겼다).
#
# 전략: 전역은 관대하게, **타입을 붙인 모듈만** 엄격하게.
# 한 번에 전부 켜면 수백 개 오류에 묻혀 진짜 신호를 못 본다. 이미 정리된
# 모듈부터 잠그고, 새로 정리하는 모듈을 아래 목록에 추가해 나간다.
[tool.mypy]
python_version = "3.13"
# src 레이아웃이라 경로를 알려준다. 편집 가능 설치의 .pth 리다이렉트를
# 검사기가 항상 따라가는 것은 아니다.
mypy_path = "src"
files = ["src", "tests", "scripts"]

# numpy 배열 별칭(Annotated NDArray)은 형상까지 검사하지 못한다.
# 그래도 '이게 배열인가 float 인가 리스트인가'는 잡아 준다.
ignore_missing_imports = true       # osqp / mujoco / mediapy 에 스텁이 없다
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# 아직 정리되지 않은 모듈. 정리하면 여기서 지운다.
# (plot_data / presentation_plot 은 참조가 0 이라 저장소 정리 때 삭제했다.)
[[tool.mypy.overrides]]
module = [
    "quadruped_mpc.viz.visualization",
    "quadruped_mpc.plants.srb",
    "quadruped_mpc.control.gait_planning",
]
ignore_errors = true

# 정리 완료 — 여기 있는 모듈은 타입 없는 정의를 허용하지 않는다.
[[tool.mypy.overrides]]
module = [
    "quadruped_mpc.core.angles",
    "quadruped_mpc.core.bezier",
    "quadruped_mpc.core.clock",
    "quadruped_mpc.core.robot_types",
    "quadruped_mpc.core.rotations",
    "quadruped_mpc.control.convex_mpc",
    "quadruped_mpc.control.planning",
    "quadruped_mpc.control.swing",
    "quadruped_mpc.plants.model_audit",
    "quadruped_mpc.plants.plant_base",
    "quadruped_mpc.paths",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
