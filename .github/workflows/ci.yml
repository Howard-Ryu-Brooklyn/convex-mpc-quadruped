name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[mujoco,dev]"

      # Golden trajectory tests are not run here. They are run by
      # .github/workflows/golden-probe.yml, on demand.
      #
      # Why they are separate, stated honestly: the golden tests compare
      # 3-second trajectories element-wise at rtol=1e-9, and whether that
      # holds across platforms is a *measured* question, not an assumed one.
      #
      # Measured (full table in CONTRIBUTING.md): the baselines were
      # captured on macOS/arm64 and reproduce at rtol=1e-9 on Linux/x86-64
      # (numpy 2.5.3 and 2.4.6, scipy-openblas) and on a macOS runner
      # (Apple Accelerate). OpenBLAS and Accelerate are different
      # implementations — different kernels, different accumulation order —
      # and the trajectories still agree to picometres.
      #
      # So why is golden still not a gate here? Because osqp is 1.1.3 in
      # every row of that table. What has been varied is BLAS, numpy, CPU
      # and interpreter — not the QP solver, which is what actually decides
      # the trajectory. When osqp 2.x lands, that evidence says nothing.
      # Re-run the probe on every dependency bump, and promote golden into
      # this workflow after a few more greens, with the table as evidence.
      #
      # Until then golden is a local gate (`make check-all` before a PR),
      # and the badge on this workflow promises only what it can: the
      # platform-independent checks are green.

      - name: Physics and contract tests
        run: pytest -m "not golden" -q

      - name: Types
        run: mypy
