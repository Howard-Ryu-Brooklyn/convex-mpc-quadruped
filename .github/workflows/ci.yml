name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[mujoco,dev]"

      # Golden trajectory tests are not run here. They are run by
      # .github/workflows/golden-probe.yml, on demand.
      #
      # Why they are separate, stated honestly: the golden tests compare
      # 3-second trajectories element-wise at rtol=1e-9, and whether that
      # holds across platforms is a *measured* question, not an assumed one.
      #
      # Measured so far (see the table in CONTRIBUTING.md): the baselines
      # were captured on macOS/arm64 with Python 3.13 and reproduce at
      # rtol=1e-9 on macOS/Python 3.12 (miniforge), on Linux/x86-64 with
      # Python 3.13 and 3.11, and on a clean macOS runner. Three
      # interpreters, two CPUs, different BLAS and OSQP builds, identical
      # trajectories to picometres.
      #
      # So why is golden still not a gate here? Because one green run says
      # "it passed on this combination", not "it will pass". Dependencies
      # move — osqp 2.x, numpy 3.x — and the honest answer is to re-measure
      # then. Promote golden into this workflow after a few more greens,
      # with that table as the evidence.
      #
      # Until then golden is a local gate (`make check-all` before a PR),
      # and the badge on this workflow promises only what it can: the
      # platform-independent checks are green.

      - name: Physics and contract tests
        run: pytest -m "not golden" -q

      - name: Types
        run: mypy
