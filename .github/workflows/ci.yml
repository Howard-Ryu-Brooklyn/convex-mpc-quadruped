name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[mujoco,dev]"

      # Golden trajectory tests are not run here. They are run by
      # .github/workflows/golden-probe.yml, on demand.
      #
      # Why they are separate, stated honestly: the golden tests compare
      # 3-second trajectories element-wise at rtol=1e-9, and whether that
      # holds across platforms is a *measured* question, not an assumed one.
      #
      # What has been measured so far — both on macOS/arm64:
      #     captured   Python 3.13.4, homebrew venv, numpy 2.5.1, osqp 1.1.3
      #     reproduced Python 3.12.10, miniforge base, different numpy and
      #                osqp builds  -> passes at rtol=1e-9
      #
      # What has NOT been measured: Linux/x86-64, where numpy links a
      # different BLAS and OSQP is a different wheel. It may well pass. The
      # probe workflow exists to find out rather than to guess, and the
      # answer will be recorded in CONTRIBUTING.md when it is known.
      #
      # Until then golden stays a local gate (`make check-all` before a PR),
      # and the badge on this workflow means only what it can actually
      # promise: the platform-independent checks are green.

      - name: Physics and contract tests
        run: pytest -m "not golden" -q

      - name: Types
        run: mypy
