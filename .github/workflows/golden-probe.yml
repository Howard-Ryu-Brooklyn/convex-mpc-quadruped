# Golden reproducibility probe — an experiment, not a gate.
#
# Question: the golden trajectories were captured on macOS/arm64. Do they
# reproduce at rtol=1e-9 on a different CPU, a different BLAS and a
# different OSQP wheel?
#
# The answer is written to the run's **job summary**, not buried in the
# step log. A probe whose answer costs four clicks to reach is a probe
# nobody reads — the same reason the runners expose max_torque_stance and
# max_torque_swing separately instead of one number.
#
# Deliberately manual (workflow_dispatch) and badge-less: a question whose
# answer is unknown should not sit on a badge, because nobody would know
# what the badge promises.
name: Golden probe

on:
  workflow_dispatch:

jobs:
  golden:
    name: golden on ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    continue-on-error: true      # 답을 모르는 질문이므로 실패도 결과다
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.13" }
          - { os: ubuntu-latest, python: "3.11" }
          - { os: macos-14,      python: "3.13" }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - run: python -m pip install -e ".[dev]"

      # 답을 낸 툴체인을 기록한다. "통과했다"만으로는 무엇이 통과한 것인지
      # 알 수 없다 - 재현성 주장은 그것을 만든 환경과 함께여야 주장이 된다.
      - name: Record the toolchain
        run: |
          python - >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import platform, numpy, scipy, osqp
          try:
              blas = numpy.show_config("dicts")["Build Dependencies"]["blas"]
              blas_s = f'{blas.get("name", "?")} {blas.get("version", "")}'.strip()
          except Exception as e:                      # numpy 가 형식을 바꾸면
              blas_s = f"(읽지 못함: {e})"            # 조용히 비우지 않고 이유를 남긴다
          print(f'### `{platform.system()} {platform.machine()}` · Python {platform.python_version()}')
          print()
          print("| | |")
          print("|---|---|")
          print(f"| platform | `{platform.platform()}` |")
          print(f"| numpy | {numpy.__version__} |")
          print(f"| scipy | {scipy.__version__} |")
          print(f"| osqp | {osqp.__version__} |")
          print(f"| BLAS | {blas_s} |")
          print()
          PY

      - name: Golden trajectories
        id: golden
        run: pytest -m golden -v

      # 판정을 요약에 남긴다. if: always() 가 없으면 실패한 경우 - 즉
      # 가장 알고 싶은 경우 - 에 이 줄이 실행되지 않는다.
      - name: Record the verdict
        if: always()
        run: |
          echo "**golden (rtol=1e-9): \`${{ steps.golden.outcome }}\`**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "결과를 CONTRIBUTING.md 의 표에 옮겨 적어라. 요약은 90 일 뒤 사라진다." >> "$GITHUB_STEP_SUMMARY"
